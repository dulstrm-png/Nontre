name: Build Dulz Strm APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Cari dan Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          mkdir -p build_source
          unzip -o "$ZIP_FILE" -d build_source

          echo "Isi hasil extract:"
          find build_source -maxdepth 3 -type f

      - name: Deteksi folder project Android
        run: |
          if [ -f "build_source/settings.gradle" ]; then
            echo "PROJECT_DIR=build_source" >> "$GITHUB_ENV"
          elif [ -f "build_source/dulz-strm-apk/settings.gradle" ]; then
            echo "PROJECT_DIR=build_source/dulz-strm-apk" >> "$GITHUB_ENV"
          else
            echo "Project Android tidak ditemukan!"
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dulz-Strm-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
