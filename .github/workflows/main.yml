name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cek isi repo
        run: ls -la

      - name: Build APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DulzFluu.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: DulzFluu-APK
          path: DulzFluu.apk
          if-no-files-found: error
