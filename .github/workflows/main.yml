name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Ekstrak zip proyek
        run: |
          unzip -q DulzFluu*.zip -d proyek
          ls -la proyek

      - name: Pakai mirror Maven Google
        run: |
          sed -i 's#mavenCentral()#maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }\n        mavenCentral()#' proyek/settings.gradle.kts
          cat proyek/settings.gradle.kts

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: proyek
        run: |
          ok=0
          for i in 1 2 3; do
            if gradle assembleDebug --no-daemon --console=plain; then ok=1; break; fi
            echo "Build gagal, ulangi percobaan ke-$((i+1)) setelah 30 detik"
            sleep 30
          done
          [ "$ok" = 1 ]

      - name: Ganti nama APK
        working-directory: proyek
        run: cp app/build/outputs/apk/debug/app-debug.apk DulzFluu.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: DulzFluu-APK
          path: proyek/DulzFluu.apk
          if-no-files-found: error
